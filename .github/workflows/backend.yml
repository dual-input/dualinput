# The backend alone, for a fix between releases: its tests, then D1's migrations and the
# Worker, run by hand on main (record/areas/build/01-the-build.md, "The backend"). Each release
# deploys it too, in the release workflow.
name: Backend

on:
  workflow_dispatch:

concurrency:
  group: backend

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: node --test src/backend/test/*.test.ts
      - run: node tools/backend.ts deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
