# The profiles' job, which CI and the release workflow both call, since a release published
# with a workflow's own token starts no other workflow (record/areas/build/01-the-build.md,
# "CI"). It builds every profile, which fails on any error, and with `publish` adds each new
# bundle at a released level to the `pages` branch, which Pages serves at
# profiles.dualinput.app (record/areas/profiles/02-units.md, "Publishing"). It needs no SDK,
# so a new SDK can't fail a pull request that changes only profiles/.
name: Profiles

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: true

jobs:
  profiles:
    runs-on: windows-latest
    # Two runs that publish at once, one for a push and one for a release, would push to
    # `pages` from the same commit, so the second waits for the first.
    concurrency:
      group: ${{ inputs.publish && 'pages' || format('profiles-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publishing takes main's newest commit, since a release's run started from an older
          # one, and a bundle published again counts as the newest at its level, so publishing
          # an older commit's would roll back a profile; it reads each release's level from every tag.
          ref: ${{ inputs.publish && 'main' || '' }}
          fetch-depth: ${{ inputs.publish && '0' || '1' }}
      - run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The publish commits to the `pages` branch from its checkout in target/pages, so the
      # checkout comes after rust-cache: on a cache that only partly matches, rust-cache cleans
      # every folder in target/ as a build profile's, keeping only build, .fingerprint, and deps,
      # and the publish's `git add` would then find no repository in target/pages and reach this
      # one, which ignores target/ (Swatinem/rust-cache 2.9.3, src/cleanup.ts, `cleanTargetDir`).
      - if: inputs.publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pages
          path: target/pages
      # The profile builder compiles in TypeScript 6.0.3's typescript.js from node_modules.
      - run: npm ci
      - if: ${{ !inputs.publish }}
        run: cargo run --locked -p dualinput-profile-builder -- build profiles
      # A profile edited on GitHub's site, or without the profile extension, can come in out of
      # the layout the formatter writes (record/areas/profiles/03-the-extension.md, "Formatting").
      - if: ${{ !inputs.publish }}
        run: cargo run --locked -p dualinput-profile-builder -- format profiles --check
      - if: inputs.publish
        run: node tools/ci.ts publish-profiles target/pages
