# The release pull request: on each push to main, the `release` branch becomes main plus one
# commit that writes the next version into every file that holds it, and the pull request's
# body holds the release's notes so far, from the commits' conventional titles and
# `Release-Note:` trailers (record/areas/build/01-the-build.md, "A release"). Merging it is what
# releases: CI runs on the merged commit, and release.yml publishes it once CI passes, then
# starts this workflow, since no push to main may come after a release for a while.
name: Release pull request

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag and commit since the last release, which the next version and the notes come from.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/release.ts pr
