# A release, which runs when CI passes on main on a release commit, `chore(release): <version>`:
# the release pull request's commit, once merged, or the first release's, pushed by hand
# (record/areas/build/01-the-build.md, "A release"). CI already passed on that commit, so this
# runs neither the checks nor the bench again. A job that can't write to the repository builds
# and packs the release, and a job that can uploads it as a draft, checks the draft, and
# publishes it. A run that fails partway is run again with "Re-run failed jobs".
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One release at a time, and none canceled midway.
concurrency:
  group: release

env:
  LIBCLANG_PATH: C:\Program Files\LLVM\bin
  COMMIT: ${{ github.event.workflow_run.head_sha }}

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore(release): ')
    runs-on: windows-latest
    # Read-only, so `vpk download github` can't list a draft as the newest release.
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Every tag and commit since the last release, which the release's notes come from.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # tools/release.ts reads the kit's palette, which loads msfs-tailwind from node_modules.
      - run: npm ci
      - run: node tools/release.ts start $env:COMMIT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dual-input/relay-tokens
          ssh-key: ${{ secrets.RELAY_TOKENS_DEPLOY_KEY }}
          path: target/relay-tokens
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Roaming/cargo-msfs/data/msfs2024
          key: msfs-sdk-${{ hashFiles('msfs-sdk.txt') }}
      - run: node tools/setup.ts
      - run: node tools/build.ts release
        env:
          DUALINPUT_RELAY_TOKENS: ${{ github.workspace }}/target/relay-tokens
      - run: node tools/release.ts download
      - run: node tools/release.ts pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: target/releases
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      # To start release-pr.yml once the release is out, for any feat or fix merged meanwhile.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: target/releases
      - run: node tools/release.ts upload $env:COMMIT
      - run: node tools/release.ts check
      - run: node tools/release.ts publish
      - run: gh workflow run release-pr.yml --ref main

  profiles:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/profiles.yml
    with:
      publish: true
