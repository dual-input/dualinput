# Every Rust crate of Dual Input but the desktop app is in this one workspace, so every program
# builds with the same version of each dependency, from one Cargo.lock, and shares the settings
# below. src/apps/desktop/Cargo.toml says why that one is a workspace of its own.
[workspace]
# Members are named by folder globs: `src/engines/*` makes every folder under src/engines/ a
# member, so adding or deleting a crate's folder needs no edit here. Cargo stops with an
# error when a glob matches no folder at all, or matches a folder without a Cargo.toml.
# Some engines are TypeScript rather than Rust, such as src/engines/page-client, and have no
# Cargo.toml.
#
# - When you add the first crate under a top folder that has no glob yet, such as
#   src/relays/, add that folder's glob along with it.
# - When you add a TypeScript folder that a glob matches, list it in an `exclude` list
#   beside `members`.
members = ["src/engines/*", "src/platform/*", "src/features/*/core", "src/features/*/routines", "src/apps/*", "src/sim-package/*", "tools/msfs-sdk", "tools/profile-author", "tools/figure-viewer", "tools/profile-builder", "tools/bench/core-helper", "tools/bench/droplet", "tools/bench/relay", "tools/sim/desk"]
# TypeScript, the sim's stock files, and the desktop app.
exclude = ["src/engines/page-client", "src/platform/banner", "src/platform/desktop-shell", "src/platform/efb-shell", "src/platform/panel-bridge", "src/sim-package/pages", "src/sim-package/panel", "src/sim-package/stock", "src/apps/desktop"]
# A plain `cargo build` builds these. src/sim-package/'s glob stays out of this list, since our
# WASM module's build script needs settings only cargo-msfs gives it, so the module's list of
# routines, which builds anywhere, is named on its own.
default-members = ["src/engines/*", "src/platform/*", "src/features/*/core", "src/features/*/routines", "src/apps/*", "src/sim-package/routines", "tools/msfs-sdk", "tools/profile-author", "tools/figure-viewer", "tools/profile-builder", "tools/bench/core-helper", "tools/bench/droplet", "tools/bench/relay", "tools/sim/desk"]
resolver = "3"

# Two builds with different versions refuse to connect, rather than misread each other's
# messages. Every crate inherits this one version, so all of a build's programs agree on it, and
# src/apps/desktop/Cargo.toml names the same one, which tools/check.ts fails if it differs from.
[workspace.package]
version = "0.1.0"
edition = "2024"

# A replay of the core has to visit everything in the order the run did, and a HashMap's
# order is seeded at random each run. So the loop's crates, every crate outside src/apps/,
# src/sim-package/, tools/, the transport, the sim edge, and the stand-in sim, fail Clippy on a
# `for` loop over one, and on a call to a function clippy.toml lists, such as
# `Instant::now`, even without `-D warnings`. Each loop crate opts in with
# `[lints] workspace = true`. clippy.toml and EDGE_ENGINES in tools/map-check.ts list the
# same crates, so change all three together.
[workspace.lints.clippy]
iter_over_hash_type = "deny"
disallowed_methods = "deny"

# Our WASM module, the code we load into the sim, is built by cargo-msfs, whose README
# asks for `lto` and `strip`: `lto` optimizes across crates, and `strip` leaves debug
# symbols out of the output. Cargo reads profiles only from the workspace's root, so they
# live here and apply to every program's release build, the module's among them, and
# src/apps/desktop/Cargo.toml repeats `lto` and `strip`, so change both together.
#
# `panic = "abort"` ends the core at a panic on any of its threads, so a panic on an edge
# thread can't leave the loop running without it, and the desktop app starts the core
# again (record/areas/core/01-loop-and-edge.md, "A panic").
[profile.release]
lto = true
strip = true
panic = "abort"

# The bench's scenarios check timing as well as behavior, so the bench builds its programs
# optimized, as a pilot's core is, with the checks a development build makes still on. It
# unwinds a panic, since the stand-in sim catches a routine's panic the way the sim traps our
# module, and it leaves out `lto` and builds incrementally, so a run after a small change
# rebuilds quickly (record/areas/build/02-testing.md, "Building what it runs").
[profile.release-with-checks]
inherits = "release"
overflow-checks = true
debug-assertions = true
panic = "unwind"
lto = false
incremental = true
