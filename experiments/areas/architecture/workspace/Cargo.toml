# p11: one Cargo workspace holding a Windows program, the message crate, our
# WASM module's host, one routine, and the module itself, which cargo-msfs
# builds for wasm32 from its own folder. p08 kept its module out of its
# workspace (flight/Cargo.toml, exclude = ["module"]); p11 asks whether it has to.
[workspace]
members = ["messages", "module-host", "follow", "module", "core"]
# The module's build script needs the SDK that cargo-msfs names in MSFS_SDK, so
# a plain cargo build at the root leaves it out.
default-members = ["messages", "module-host", "follow", "core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
messages = { path = "messages" }
module-host = { path = "module-host" }
follow = { path = "follow" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.27", features = ["serde"] }
ts-rs = { version = "=12.0.1", features = ["uuid-impl"] }
bindgen = "0.72"

# cargo-msfs's README asks for both; in a workspace only the root's profile counts.
[profile.release]
lto = true
strip = true
