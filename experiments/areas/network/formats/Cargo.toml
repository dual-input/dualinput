[package]
name = "p02-formats"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
uuid = { version = "1.27.0", features = ["serde"] }
postcard = { version = "=1.1.3", features = ["alloc"] }
rmp-serde = "=1.3.1"
bitcode = { version = "=0.6.9", features = ["serde", "uuid"] }
wincode = { version = "=0.6.2", features = ["derive", "uuid"] }

[profile.release]
debug = false
