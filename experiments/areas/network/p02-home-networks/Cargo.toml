# p02: node 2.3's probe across friends' home networks.
# The tester is the Windows program friends run, the peer answers it on our PC and in
# the droplets' simulated NATs, and the station runs on each droplet.
[workspace]
members = ["common", "tester", "peer", "station"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
iroh = "=1.3.0"
noq = { version = "=1.3.0", default-features = false, features = ["rustls", "ring", "runtime-tokio"] }
tokio = { version = "1.53", features = ["full"] }
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
flate2 = "1"
rcgen = "0.14"
n0-watcher = "1"
n0-future = "0.3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
