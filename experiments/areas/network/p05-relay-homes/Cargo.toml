# p05: which relay carries each direction when two pilots home at different relays.
# One program plays both ends; run.mjs places them on the droplets and samples each relay
# socket's byte counters.
[package]
name = "p05-relay-homes"
edition = "2024"
version = "0.1.0"
publish = false

[workspace]

[[bin]]
name = "p05"
path = "src/main.rs"

[dependencies]
p02-common = { path = "../p03-home-networks/common" }
iroh = "=1.3.0"
tokio = { version = "1.53", features = ["full"] }
serde_json = "1"
anyhow = "1"
n0-watcher = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
