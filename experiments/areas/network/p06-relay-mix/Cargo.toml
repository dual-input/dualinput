# p06: v1's full traffic mix over iroh's relay under loss, with two ways of handing one-off
# datagrams to QUIC. run.mjs places the lossy end in a network namespace on the Frankfurt droplet.
[package]
name = "p06-relay-mix"
edition = "2024"
version = "0.1.0"
publish = false

[workspace]

[[bin]]
name = "p06"
path = "src/main.rs"

[dependencies]
p02-common = { path = "../p03-home-networks/common" }
iroh = "=1.3.0"
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
