# p07: recovery after a full outage, on the same connection while it survives and by redialing
# once it doesn't. run.mjs drops everything to and from a namespace on the Frankfurt droplet.
[package]
name = "p07-outage"
edition = "2024"
version = "0.1.0"
publish = false

[workspace]

[[bin]]
name = "p07"
path = "src/main.rs"

[dependencies]
p02-common = { path = "../p03-home-networks/common" }
iroh = "=1.3.0"
tokio = { version = "1.53", features = ["full"] }
serde_json = "1"
anyhow = "1"
n0-watcher = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
