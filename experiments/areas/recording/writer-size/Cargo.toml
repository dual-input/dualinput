# cargo run --release -- ../../../../tools/bench/fixtures/flight-58p-egll-600s.bin.zst
[package]
name = "writer-size"
edition = "2024"
version = "0.1.0"
publish = false

[workspace]

[dependencies]
recording-format = { path = "../../../../src/engines/recording-format" }
