[package]
name = "dualinput-p30"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
bindgen = "0.72"

# cargo-msfs's README asks for both.
[profile.release]
lto = true
strip = true

# Its own workspace, so the repository's root workspace leaves it out.
[workspace]
