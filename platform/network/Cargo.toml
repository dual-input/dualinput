[package]
name = "network"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
clients = { path = "../clients" }
# Signs the backend's requests with the endpoint key, on the loop, as the crate iroh-base
# builds its keys on.
ed25519-dalek = { version = "3.0.0", default-features = false }
kernel = { path = "../kernel" }
messages = { path = "../../engines/messages" }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.44"

# build.rs compiles the default relay list from relays/relays.toml.
[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

# tests/relays.rs compiles build.rs into the tests, so the tests need its crates too. When you
# change a version in one list, change it in the other.
[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[lints]
workspace = true
