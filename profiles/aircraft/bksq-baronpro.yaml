    name: Radar mode
    watch: L('var_radarMode')
    write: L('var_radarMode')
  radar_gain:
    name: Radar gain
    watch: L('var_RadarGain')
    write: L('var_RadarGain')
  radar_tilt:
    name: Radar tilt
    watch: L('var_RadarTilt')
    write: L('var_RadarTilt')
  radar_brightness:
    name: Radar brightness
    watch: L('var_RadarBrightness')
    write: L('var_RadarBrightness')
  radar_alert:
    name: Radar alert
    watch: instrument('bksq_wradar1', 'weatherRadarMainMap.map.alertMode')
    write:
      toggle: H('bksq_wradar1_radarAlertToggle')
  radar_profile:
    name: Radar vertical profile
    watch: instrument('bksq_wradar1', 'weatherRadarMainMap.map.verticalMode')
    write: |
      (value) => {
        if (state.radar_mode > 3 || value == state.radar_profile) return
        if (value) { if (state.radar_mode == 3) write(H('bksq_wradar1_radarProfile')) }
        else write(H('bksq_wradar1_radarMap'))
      }
  radar_hold:
    name: Radar hold
    watch: instrument('bksq_wradar1', 'weatherRadarMainMap.map.radarHold')
    write: |
      (value) => {
        if (state.radar_mode <= 3 && value != state.radar_hold) write(H('bksq_wradar1_radarHold'))
      }
  radar_track:
    name: Radar track
    watch: instrument('bksq_wradar1', 'weatherRadarMainMap.map.radarTrack')
    write: |
      (value) => {
        if (state.radar_mode > 3) return
        const steps = Math.round((value - state.radar_track) / 2.5)
        if (steps > 0) write(H('bksq_wradar1_radarTrackRight')).repeat(steps)
        else if (steps < 0) write(H('bksq_wradar1_radarTrackLeft')).repeat(-steps)
      }

