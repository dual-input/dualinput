maker: Black Square
name: Baron 58P Professional
maturity: experimental
authors: Dual Input

aircraft:
  variants:
    press: bksq-aircraft-baronpropress

# The tablet, the one display of the package's own that takes presses on its screen; its radios and
# engine monitor take knobs and buttons, and the GTNs are other packages' (read in
# bksq-aircraft-baronpro 0.1.1, panel.*\PANEL.CFG and the gauges' JavaScript).
displays: BlackSquareTablet

state:
  # ═══ ELECTRICAL ═════════════════════════════════════════════════════════════════════════════════
  battery:
    name: Battery
    watch: B('ELECTRICAL_Battery_1')
    write:
      toggle: B('ELECTRICAL_Battery_1_Toggle')
  alternator_1:
    name: Left alternator
    watch: B('ELECTRICAL_Alternator_1')
    write:
      toggle: B('ELECTRICAL_Alternator_1_Toggle')
  alternator_2:
    name: Right alternator
    watch: B('ELECTRICAL_Alternator_2')
    write:
      toggle: B('ELECTRICAL_Alternator_2_Toggle')
  avionics_master:
    name: Avionics master
    watch: B('ELECTRICAL_Avionics_Bus_1')
    write:
      toggle: B('ELECTRICAL_Avionics_Bus_1_Toggle')
  external_power:
    name: External power
    watch: A('EXTERNAL POWER ON:1', 'Bool')
    write:
      toggle: K('TOGGLE_EXTERNAL_POWER')

  # ── Breakers ────────────────────────────────────────────────────────────────────────────────────
  # Only the seven breakers that export a variable are synced: the others read through A:CIRCUIT
  # CONNECTION ON:n, which needs A:BUS LOOKUP INDEX set first (read in bksq-aircraft-baronpro 0.1.1,
  # BaronProfessional_Templates.xml; whether SimConnect reads one right without the index set is
  # unmeasured).
  breaker_gear_relay:
    name: Landing gear relay breaker
    watch: L('var_Breaker_LandingGearRelay_readonly')
    write:
      toggle: K('ELECTRICAL_BUS_TO_BUS_CONNECTION_TOGGLE', 2, 6)
  breaker_gear_motor:
    name: Landing gear motor breaker
    watch: L('var_Breaker_LandingGearMonitor_readonly')
    write:
      toggle: K('ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE', 6, 6)
  breaker_flap_relay:
    name: Flap relay breaker
    watch: L('var_Breaker_FlapRelay_readonly')
    write:
      toggle: K('ELECTRICAL_BUS_TO_BUS_CONNECTION_TOGGLE', 2, 4)
  breaker_flap_motor:
    name: Flap motor breaker
    watch: L('var_Breaker_FlapMotor_readonly')
    write:
      toggle: K('ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE', 4, 3)
  breaker_avionics_relay:
    name: Avionics relay breaker
    watch: L('var_Breaker_AvionicsPowerRelay_readonly')
    write:
      toggle: K('ELECTRICAL_BUS_TO_BUS_CONNECTION_TOGGLE', 3, 5)
  breaker_volt_meter:
    name: Volt meter breaker
    watch: L('var_Breaker_VoltMeter_readonly')
    write:
      toggle: K('ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE', 2, 17)
  breaker_starter:
    name: Starter relay breaker
    watch: L('var_Breaker_Starter_readonly')
    write: |
      (value) => {
        if (value == state.breaker_starter) return
        write(K('ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE', 1, 1))
        write(K('ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE', 1, 32))
      }

  # ═══ LIGHTS ═════════════════════════════════════════════════════════════════════════════════════
  beacon:
    name: Beacon
    watch: B('LIGHTING_BEACON_1')
    write:
      toggle: B('LIGHTING_BEACON_1_Toggle')
  strobe:
    name: Strobe
    watch: B('LIGHTING_STROBE_1')
    write:
      toggle: B('LIGHTING_STROBE_1_Toggle')
  nav_lights:
    name: Navigation lights
    watch: B('LIGHTING_NAV_1')
    write:
      toggle: B('LIGHTING_NAV_1_Toggle')
  taxi_light:
    name: Taxi light
    watch: B('LIGHTING_TAXI_1')
    write:
      toggle: B('LIGHTING_TAXI_1_Toggle')
  landing_light_1:
    name: Left landing light
    watch: B('LIGHTING_LANDING_1')
    write:
      toggle: B('LIGHTING_LANDING_1_Toggle')
  landing_light_2:
    name: Right landing light
    watch: B('LIGHTING_LANDING_2')
    write:
      toggle: B('LIGHTING_LANDING_2_Toggle')
  ice_light:
    name: Ice light
    watch: B('LIGHTING_WING_1')
    write:
      toggle: B('LIGHTING_WING_1_Toggle')
  glareshield_flood:
    name: Glareshield flood
    watch: L('bksq_MasterGlareshieldLights')
    write: L('bksq_MasterGlareshieldLights')
  panel_lights:
    name: Panel lights
    watch: L('bksq_MasterPanelLights')
    write: L('bksq_MasterPanelLights')
  flight_instrument_lights:
    name: Flight instrument lights
    watch: L('var_FlightInstrumentsLightingKnob')
    write: L('var_FlightInstrumentsLightingKnob')
  engine_instrument_lights:
    name: Engine instrument lights
    watch: L('var_EngineInstrumentsLightingKnob')
    write: L('var_EngineInstrumentsLightingKnob')
  glareshield_lights:
    name: Glareshield lights
    watch: L('var_GlareshieldLightingKnob')
    write: L('var_GlareshieldLightingKnob')
  subpanel_lights:
    name: Subpanel lights
    watch: L('var_SubpanelLightingKnob')
    write: L('var_SubpanelLightingKnob')
  cockpit_light_1:
    name: Cockpit light 1
    watch: L('var_LIGHTING_Push_Cockpit_1')
    write: L('var_LIGHTING_Push_Cockpit_1')
  cockpit_light_2:
    name: Cockpit light 2
    watch: L('var_LIGHTING_Push_Cockpit_2')
    write: L('var_LIGHTING_Push_Cockpit_2')
  cockpit_light_3:
    name: Cockpit light 3
    watch: L('var_LIGHTING_Push_Cockpit_3')
    write: L('var_LIGHTING_Push_Cockpit_3')
  cockpit_light_4:
    name: Cockpit light 4
    watch: L('var_LIGHTING_Push_Cockpit_4')
    write: L('var_LIGHTING_Push_Cockpit_4')
  cockpit_light_5:
    name: Cockpit light 5
    watch: L('var_LIGHTING_Push_Cockpit_5')
    write: L('var_LIGHTING_Push_Cockpit_5')
  cockpit_light_6:
    name: Cockpit light 6
    watch: L('var_LIGHTING_Push_Cockpit_6')
    write: L('var_LIGHTING_Push_Cockpit_6')
  map_light_1:
    name: Pilot map light
    watch: L('var_OatMapCompassLightButton_1')
    write: L('var_OatMapCompassLightButton_1')
  map_light_2:
    name: Copilot map light
    watch: L('var_OatMapCompassLightButton_2')
    write: L('var_OatMapCompassLightButton_2')
  annunciator_test:
    name: Annunciator test
    watch: L('var_AnnunciatorTestButton')
    write: L('var_AnnunciatorTestButton')

  # ═══ FUEL ═══════════════════════════════════════════════════════════════════════════════════════
  fuel_selector_1:
    name: Left fuel selector
    watch: A('FUEL TANK SELECTOR:1', 'Enum')
    write: |
      (value) => {
        if (value == 0) write(K('FUEL_SELECTOR_OFF'))
        else if (value == 19) write(K('FUEL_SELECTOR_LEFT_MAIN'))
        else if (value == 20) write(K('FUEL_SELECTOR_RIGHT_MAIN'))
      }
  fuel_selector_2:
    name: Right fuel selector
    watch: A('FUEL TANK SELECTOR:2', 'Enum')
    write: |
      (value) => {
        if (value == 0) write(K('FUEL_SELECTOR_2_OFF'))
        else if (value == 19) write(K('FUEL_SELECTOR_2_LEFT_MAIN'))
        else if (value == 20) write(K('FUEL_SELECTOR_2_RIGHT_MAIN'))
      }
  fuel_pump_1:
    name: Left fuel pump
    watch: L('var_FUEL_Switch_Pump_1')
    write: L('var_FUEL_Switch_Pump_1')
  fuel_pump_2:
    name: Right fuel pump
    watch: L('var_FUEL_Switch_Pump_2')
    write: L('var_FUEL_Switch_Pump_2')

  # ═══ ENGINE LEVERS ══════════════════════════════════════════════════════════════════════════════
  throttle_1:
    name: Left throttle
    watch: A('GENERAL ENG THROTTLE LEVER POSITION:1', 'Position 16k')
    write: A('GENERAL ENG THROTTLE LEVER POSITION:1', 'Position 16k')
    owner: pilot_flying
  throttle_2:
    name: Right throttle
    watch: A('GENERAL ENG THROTTLE LEVER POSITION:2', 'Position 16k')
    write: A('GENERAL ENG THROTTLE LEVER POSITION:2', 'Position 16k')
    owner: pilot_flying
  propeller_1:
    name: Left propeller
    watch: A('GENERAL ENG PROPELLER LEVER POSITION:1', 'Position 16k')
    write: K('PROP_PITCH1_SET')
    owner: pilot_flying
  propeller_2:
    name: Right propeller
    watch: A('GENERAL ENG PROPELLER LEVER POSITION:2', 'Position 16k')
    write: K('PROP_PITCH2_SET')
    owner: pilot_flying
  mixture_1:
    name: Left mixture
    watch: L('BKSQ_MixtureLeverPosition_1')
    write: L('BKSQ_MixtureLeverPosition_1')
    owner: pilot_flying
  mixture_2:
    name: Right mixture
    watch: L('BKSQ_MixtureLeverPosition_2')
    write: L('BKSQ_MixtureLeverPosition_2')
    owner: pilot_flying
  friction_lock:
    name: Friction lock
    watch: L('var_FrictionLock')
    write: L('var_FrictionLock')

  # ── Cowl flaps ──────────────────────────────────────────────────────────────────────────────────
  cowl_flap_1:
    name: Left cowl flap
    watch: A('RECIP ENG COWL FLAP POSITION:1', 'Position 16k')
    write: K('COWLFLAP1_SET')
  cowl_flap_2:
    name: Right cowl flap
    watch: A('RECIP ENG COWL FLAP POSITION:2', 'Position 16k')
    write: K('COWLFLAP2_SET')

  # ── Magnetos and starters ───────────────────────────────────────────────────────────────────────
  # The knob's animation code springs position 4 back to 3 once the return time is 0.5s old, and
  # only a click sets that time, so a written 4 would snap straight back; the far-future time holds
  # it at 4 until the other pilot lets go and 3 arrives (read in bksq-aircraft-baronpro 0.1.1,
  # BaronProfessional_Base_INT.xml, ELECTRICAL_Switch_Magneto_1).
  ignition_1:
    name: Left ignition
    watch: L('BKSQ_IgnitionPosition_1')
    write: |
      (value) => {
        if (value == 4) write(L('starterKnobReturnTime_L'), 1000000000)
        write(L('BKSQ_IgnitionPosition_1'), value)
      }
  ignition_2:
    name: Right ignition
    watch: L('BKSQ_IgnitionPosition_2')
    write: |
      (value) => {
        if (value == 4) write(L('starterKnobReturnTime_R'), 1000000000)
        write(L('BKSQ_IgnitionPosition_2'), value)
      }
  prop_sync:
    name: Prop sync
    watch: L('var_PropSyncSwitch')
    write: L('var_PropSyncSwitch')

  # ═══ FLIGHT CONTROLS ════════════════════════════════════════════════════════════════════════════
  flaps:
    name: Flaps
    watch: A('FLAPS HANDLE PERCENT', 'Position 16k')
    write: K('FLAPS_SET')
  gear:
    name: Landing gear
    watch: A('GEAR HANDLE POSITION', 'Bool')
    write: B('LANDING_GEAR_Gear_Set')
  gear_crank_handle:
    name: Gear crank handle
    watch: L('var_manualExtensionHandleDeployed')
    write: L('var_manualExtensionHandleDeployed')
  gear_crank_turns:
    name: Gear crank
    watch: L('var_manualExtensionHandleTurns')
    write: L('var_manualExtensionHandleTurns')
  parking_brake:
    name: Parking brake
    watch: A('BRAKE PARKING POSITION', 'Bool')
    write: B('LANDING_GEAR_ParkingBrake_Set')
  # A known limit: as a following 58P takes control with its autopilot engaged, the autopilot, wound
  # up while the aircraft was frozen, runs this trim away within a second of the write that puts it
  # at the old PF's, to -55% in one run, and rolls the aircraft, until it settles within about 9s
  # (measured on MSFS 2024, 2026-11-19, record/areas/flight-model/log.md, "After a handover the
  # 58P's own autopilot rolls the aircraft and runs its trim, wound up while `Follow` held it
  # frozen, which v1 keeps as a known limit").
  elevator_trim:
    name: Elevator trim
    watch: A('ELEVATOR TRIM PCT', 'Percent')
    write: |
      (value) => {
        write(K('ELEVATOR_TRIM_SET'), Math.max(-16383, Math.min(16383, Math.round(value * 163.83))))
      }
    owner: pilot_flying
  aileron_trim:
    name: Aileron trim
    watch: A('AILERON TRIM PCT', 'Percent')
    write: A('AILERON TRIM PCT', 'Percent')
    owner: pilot_flying
  rudder_trim:
    name: Rudder trim
    watch: A('RUDDER TRIM PCT', 'Percent')
    write: A('RUDDER TRIM PCT', 'Percent')
    owner: pilot_flying
  control_lock:
    name: Control lock
    watch: L('bksq_controlLocks')
    write: L('bksq_controlLocks')

  # ═══ AUTOPILOT ══════════════════════════════════════════════════════════════════════════════════
  ap_master:
    name: Autopilot
    watch: A('AUTOPILOT MASTER', 'Bool')
    write:
      toggle: K('AP_MASTER')
  flight_director:
    name: Flight director
    watch: A('AUTOPILOT FLIGHT DIRECTOR ACTIVE', 'Bool')
    write:
      toggle: K('TOGGLE_FLIGHT_DIRECTOR')
  yaw_damper:
    name: Yaw damper
    watch: A('AUTOPILOT YAW DAMPER', 'Bool')
    write:
      toggle: K('YAW_DAMPER_TOGGLE')
  ap_heading_mode:
    name: Autopilot heading mode
    watch: A('AUTOPILOT HEADING LOCK', 'Bool')
    write:
      toggle: K('AP_PANEL_HEADING_HOLD')
  ap_nav_mode:
    name: Autopilot nav mode
    watch: A('AUTOPILOT NAV1 LOCK', 'Bool')
    write:
      toggle: K('AP_NAV1_HOLD')
  ap_approach_mode:
    name: Autopilot approach mode
    watch: A('AUTOPILOT APPROACH HOLD', 'Bool')
    write:
      toggle: K('AP_APR_HOLD')
  ap_back_course_mode:
    name: Autopilot back course mode
    watch: A('AUTOPILOT BACKCOURSE HOLD', 'Bool')
    write:
      toggle: K('AP_BC_HOLD')
  ap_altitude_hold:
    name: Autopilot altitude hold
    watch: A('AUTOPILOT ALTITUDE LOCK', 'Bool')
    write: |
      (value) => {
        if (value == state.ap_altitude_hold) return
        write(value ? K('AP_ALT_HOLD') : K('AP_PITCH_LEVELER_ON'))
      }
  ap_vs_hold:
    name: Autopilot vertical speed mode
    watch: A('AUTOPILOT VERTICAL HOLD', 'Bool')
    write:
      toggle: K('AP_PANEL_VS_HOLD', 1)
  # A known limit for this and the armed vertical speed below: as vertical speed mode engages, a
  # following machine's autopilot sets its own target, likely from its own climb rate (unverified),
  # which goes to the crew as its pilot's change (measured on MSFS 2024, 2026-11-16,
  # record/areas/sync/log.md).
  ap_vertical_speed:
    name: Autopilot vertical speed
    watch: A('AUTOPILOT VERTICAL HOLD VAR:1', 'Feet per minute')
    write: |
      (value) => {
        write(K('AP_VS_VAR_SET_ENGLISH'), Math.round(value))
      }
  pms50_apga_running:
    name: PMS50 autopilot manager
    watch: L('PMS50_APGA_RUNNING')
    write: none
  pms50_apga_vertical_mode:
    name: PMS50 vertical mode
    watch: L('PMS50_APGA_ACTIVE_VERTICAL_MODE')
    write: none

  # ── Altitude selector ───────────────────────────────────────────────────────────────────────────
  ap_altitude:
    name: Selected altitude
    watch: A('AUTOPILOT ALTITUDE LOCK VAR', 'Feet')
    write: |
      (value) => {
        write(K('AP_ALT_VAR_SET_ENGLISH'), Math.round(value))
      }
  kas_vs_adjust:
    name: Altitude selector knob pulled
    watch: L('var_VsAdjustMode')
    write: L('var_VsAdjustMode')
  kas_arm:
    name: Altitude arm
    watch: instrument('KAS297B_1|Index=1', 'optionalArmingMode')
    write:
      toggle: H('kas297b_ArmButton')
  kas_armed_vs:
    name: Armed vertical speed
    watch: instrument('KAS297B_1|Index=1', 'armedVerticalSpeed')
    write: |
      (value) => {
        const vsHold = state.pms50_apga_running
          ? state.pms50_apga_vertical_mode > 0
          : state.ap_vs_hold == 1
        if (state.kas_vs_adjust != 1 || vsHold) return
        const steps = Math.round((value - state.kas_armed_vs) / 100)
        if (steps > 0) write(H('kas297b_100_INC')).repeat(steps)
        else if (steps < 0) write(H('kas297b_100_DEC')).repeat(-steps)
      }

  # ═══ INSTRUMENTS ════════════════════════════════════════════════════════════════════════════════
  # A reading that matches no write counts as this pilot's own turn and goes back to the crew, and
  # the knob's preset turns degrees into 1/16,384ths of a turn, so a written 1° reads back as
  # 1.0107°. So the function returns the value the bug will read, which the sync engine waits for in
  # place of the one it gave. It rounds to the nearest step, which 1° fits, though rounding up fits
  # it too (unverified; measured on MSFS 2024, 2026-11-16, record/areas/sync/log.md, "The drift
  # after a handover was the host's heading bug, which no write moved after its first, and every
  # `_Set` preset that missed took the value of its first call").
  heading_bug:
    name: Heading bug
    watch: A('AUTOPILOT HEADING LOCK DIR:1', 'Degrees')
    write: |
      (value) => {
        write(B('INSTRUMENT_Heading_Bug_Set'), value)
        const turn = 16384
        const degrees = ((value % 360) + 360) % 360
        return (Math.round(degrees * turn / 360) % turn) * 360 / turn
      }
  hsi_course:
    name: HSI course
    watch: A('NAV OBS:1', 'Degrees')
    write:
      inc: K('VOR1_OBI_INC')
      dec: K('VOR1_OBI_DEC')
      wrap: true
      range: [0, 359]
  nav2_course:
    name: NAV 2 course
    watch: A('NAV OBS:2', 'Degrees')
    write:
      inc: K('VOR2_OBI_INC')
      dec: K('VOR2_OBI_DEC')
      wrap: true
      range: [0, 359]
  hsi_rnav_source:
    name: HSI RNAV source
    watch: L('var_rnavDrivesHsi')
    write: L('var_rnavDrivesHsi')
  gyro_slave_mode:
    name: Gyro slave mode
    watch: L('var_GyroSlaveModeSwitch')
    write: L('var_GyroSlaveModeSwitch')
  gyro_slew:
    name: Gyro slew
    watch: L('var_GyroRotationSwitch')
    write: L('var_GyroRotationSwitch')
  altimeter_1:
    name: Pilot altimeter
    watch: L('INSTRUMENT_Altimeter_1')
    write: B('INSTRUMENT_Altimeter_1_Set')
  altimeter_2:
    name: Copilot altimeter
    watch: L('INSTRUMENT_Altimeter_2')
    write: B('INSTRUMENT_Altimeter_2_Set')
  decision_height:
    name: Decision height
    watch: A('DECISION HEIGHT', 'Feet')
    write:
      inc: K('INCREASE_DECISION_HEIGHT')
      dec: K('DECREASE_DECISION_HEIGHT')
      step: 10
      wrap: false
  true_airspeed_1:
    name: Pilot true airspeed knob
    watch: L('var_TrueAirspeedKnob_L')
    write: L('var_TrueAirspeedKnob_L')
  true_airspeed_2:
    name: Copilot true airspeed knob
    watch: L('var_TrueAirspeedKnob_R')
    write: L('var_TrueAirspeedKnob_R')
  alternate_static:
    name: Alternate static
    watch: A('ALTERNATE STATIC SOURCE OPEN', 'Bool')
    write:
      toggle: K('TOGGLE_ALTERNATE_STATIC')
  gps_drives_nav1:
    name: NAV GPS source
    watch: A('GPS DRIVES NAV1', 'Bool')
    write: |
      (value) => {
        if (value == state.gps_drives_nav1) return
        if (state.gns530_disabled) write(K('TOGGLE_GPS_DRIVES_NAV1'))
        else write(H('AS530_CDI_Push'))
      }
  gns530_disabled:
    name: GNS 530 disabled
    watch: L('XMLVAR_GPS_DISABLED_AS530_1')
    write: none
  yoke_chrono_1:
    name: Pilot chronometer mode
    watch: L('var_yokeChronoMode_L')
    write: L('var_yokeChronoMode_L')
  yoke_chrono_2:
    name: Copilot chronometer mode
    watch: L('var_yokeChronoMode_R')
    write: L('var_yokeChronoMode_R')
  engine_monitor_mode:
    name: Engine monitor mode
    watch: L('var_JpiMode')
    write: L('var_JpiMode')
  engine_monitor_unit:
    name: Engine monitor unit
    watch: L('var_JpiTempUnit')
    write: L('var_JpiTempUnit')

  # ═══ DEICE ══════════════════════════════════════════════════════════════════════════════════════
  pitot_heat_1:
    name: Pilot pitot heat
    watch: A('CIRCUIT SWITCH ON:29', 'Bool')
    write:
      toggle: K('PITOT_HEAT_TOGGLE', 1)
  pitot_heat_2:
    name: Copilot pitot heat
    watch: A('CIRCUIT SWITCH ON:37', 'Bool')
    write:
      toggle: K('PITOT_HEAT_TOGGLE', 2)
  prop_deice:
    name: Prop deice
    watch: L('var_PropHeatSwitch')
    write: L('var_PropHeatSwitch')
  windshield_heat:
    name: Windshield heat
    watch: L('var_windshieldHeatSwitch')
    write: L('var_windshieldHeatSwitch')
  fuel_vent_heat:
    name: Fuel vent heat
    watch: L('var_FuelVentHeatSwitch')
    write: L('var_FuelVentHeatSwitch')
  stall_warning_heat:
    name: Stall warning heat
    watch: L('var_StallWarningHeatSwitch')
    write: L('var_StallWarningHeatSwitch')
  surface_deice:
    name: Surface deice
    watch: L('var_surfaceDeiceSwitch')
    write: L('var_surfaceDeiceSwitch')

  # ═══ CABIN AIR ══════════════════════════════════════════════════════════════════════════════════
  vent_blowers:
    name: Vent blowers
    watch: L('var_VentBlowersSwitch')
    write: L('var_VentBlowersSwitch')
  air_conditioner:
    name: Air conditioner
    watch: L('var_AirConditionerSwitch')
    write: L('var_AirConditionerSwitch')
  air_conditioning_blower:
    name: Air conditioning blower
    watch: L('var_AirConditioningBlowerSwitch')
    write: L('var_AirConditioningBlowerSwitch')
  cabin_heater:
    name: Cabin heater
    watch: L('var_CabinHeaterIgnitionSwitch')
    write: L('var_CabinHeaterIgnitionSwitch')
  cabin_heater_blower:
    name: Cabin heater blower
    watch: L('var_CabinHeaterBlowerSwitch')
    write: L('var_CabinHeaterBlowerSwitch')
  fresh_air:
    name: Fresh air knob
    watch: L('var_FreshAirKnob')
    write: L('var_FreshAirKnob')
  cabin_temp_unit:
    name: Cabin temperature unit
    watch: L('var_CabinTempUnitMode')
    write: L('var_CabinTempUnitMode')
  oxygen_handle:
    name: Oxygen handle
    watch: L('var_OxygenHandle')
    write: B('PASSENGER_Cabin_Heat_1_Set')
  cabin_heat_handle:
    name: Cabin heat handle
    watch: L('var_CabinHeatHandle')
    write: B('PASSENGER_Cabin_Heat_2_Set')
  pilot_air_handle:
    name: Pilot air handle
    watch: L('var_PilotAirHandle')
    write: B('PASSENGER_Cabin_Heat_3_Set')
  defroster_handle:
    name: Defroster handle
