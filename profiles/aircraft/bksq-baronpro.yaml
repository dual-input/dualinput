  adf_standby:
    name: ADF standby
    watch: A('ADF STANDBY FREQUENCY:1', 'Frequency ADF BCD32')
    write: K('ADF_STBY_SET')
  adf_power:
    name: ADF power
    watch: A('CIRCUIT SWITCH ON:74', 'Bool')
    write:
      toggle: K('ELECTRICAL_CIRCUIT_TOGGLE', 74)
  adf_knob_pulled:
    name: ADF knob pulled
    watch: L('var_adfKnobPulled')
    write: L('var_adfKnobPulled')
  adf_ant:
    name: ADF ANT mode
    watch: instrument('KR87A', 'antMode')
    write:
      toggle: H('adf_AntAdf')
  adf_bfo:
    name: ADF BFO
    watch: instrument('KR87A', 'bfoMode')
    write:
      toggle: H('adf_bfo')
  adf_mode:
    name: ADF mode
    watch: instrument('KR87A', 'multiMode')
    write: |
      (value) => {
        if (value == 0) { if (state.adf_mode != 0) write(H('adf_frqTransfert')) }
        else if (state.adf_mode == 0) write(H('adf_FltEt')).repeat(value)
        else if (state.adf_mode != value) write(H('adf_FltEt'))
      }

