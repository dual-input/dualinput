[package]
name = "dualinput-core"
version.workspace = true
edition.workspace = true
publish = false

# The bench build of the core, which no release turns on: the bench's socket, the test
# units its scenarios drive, and the stand-in sim in the sim edge's place, running our WASM
# module's routines natively (record/areas/build/02-testing.md, "Its place").
[features]
stand-in = [
    "dep:bytemuck",
    "dep:routine-host",
    "dep:profile-engine",
    "dep:routines",
    "dep:sandbox",
    "dep:serde",
    "dep:stand-in-sim",
    "dep:sync-engine",
    "dep:zstd",
]

[dependencies]
atc-audio = { path = "../../features/atc-audio/core" }
avatars = { path = "../../features/avatars/core" }
bytemuck = { version = "1.25.2", optional = true }
clients = { path = "../../platform/clients" }
cockpit-stream = { path = "../../platform/cockpit-stream" }
core-helper-service = { path = "../../platform/core-helper-service" }
flight-model = { path = "../../features/flight-model/core" }
# Each socket's task reads and writes its WebSocket through StreamExt and SinkExt.
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
go-to = { path = "../../features/go-to/core" }
kernel = { path = "../../platform/kernel" }
messages = { path = "../../engines/messages" }
network = { path = "../../platform/network" }
pointer-sync = { path = "../../features/pointer-sync/core" }
profile-engine = { path = "../../engines/profile-engine", optional = true }
profile-loader = { path = "../../platform/profile-loader" }
rate-and-pause = { path = "../../features/rate-and-pause/core" }
recording = { path = "../../platform/recording" }
recording-format = { path = "../../engines/recording-format" }
# The edge's fetches, through the reqwest and rustls iroh already builds, with ring, iroh's
# crypto provider, and Windows' own store of certificates.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
routine-host = { path = "../../platform/routine-host", optional = true }
routines = { path = "../../sim-package/routines", optional = true }
session = { path = "../../platform/session" }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
sim-awareness = { path = "../../engines/sim-awareness" }
sim-client = { path = "../../engines/sim-client" }
sim-edge = { path = "../../engines/sim-edge" }
sim-service = { path = "../../platform/sim-service" }
simconnect-types = { path = "../../engines/simconnect-types" }
stand-in-sim = { path = "../../engines/stand-in-sim", optional = true }
state-sync = { path = "../../features/state-sync/core" }
sandbox = { path = "../../engines/sandbox", optional = true }
sync-engine = { path = "../../engines/sync-engine", optional = true }
transport = { path = "../../engines/transport" }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = "1.0.145"
sha2 = "0.10.9"
take-control = { path = "../../features/take-control/core" }
traffic = { path = "../../features/traffic/core" }
# The core runs its sockets on tokio (decision 027), and its jobs on tokio's blocking pool.
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
# The clients' WebSocket server. iroh, which the network brings into the core, already builds
# tokio-websockets 0.13.3 with sha1_smol, so the core stays at one WebSocket implementation
# (record/areas/core/02-clients-and-panel-bridge.md, "The WebSocket server").
tokio-websockets = { version = "0.13.3", default-features = false, features = ["server", "sha1_smol"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }
# The loop under load reads its capture of a flight, which our probe p10 compressed with zstd.
zstd = { version = "0.14.3", default-features = false, optional = true }

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
]

[build-dependencies]
cc = "1.8.0"
sha2 = "0.10.9"

[dev-dependencies]
cc = "1.8.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus"] }
