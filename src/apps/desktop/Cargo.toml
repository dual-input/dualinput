# A workspace of its own, with its own Cargo.lock, since Cargo turns on each crate's features for every crate a build
# holds: in the root's workspace, Tauri's uuid gave the loop's crates getrandom, which the map check refuses, and would
# have changed how the core compiles (record/areas/build/log.md, 2026-11-01).
[workspace]

[package]
name = "dualinput-desktop"
# The root Cargo.toml's [workspace.package] names the same version, and tools/check.ts fails if they differ.
version = "0.1.0"
edition = "2024"
publish = false

# Tauri builds the window's webview, and the tray icon it took 2.2 MB to hold (record/areas/install/log.md, p01).
# custom-protocol serves the pages from the program, as the Tauri CLI's release build does, so a plain `cargo build`
# needs no CLI.
[dependencies]
# The local port's sockets read and write through StreamExt and SinkExt.
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
# Velopack writes what it does through `log`, which the app's log takes in.
log = "0.4.35"
messages = { path = "../../engines/messages" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "=2.12.1", features = ["custom-protocol", "tray-icon"] }
# Tauri's own runtime is tokio, so the local port runs on it.
tokio = { version = "1.53.3", features = ["net", "rt", "sync", "macros", "time"] }
# The same WebSocket implementation as the core's server, so the workspace stays at one. The client sends the core its
# Quit, and masks what it sends with fastrand's numbers.
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client", "fastrand", "server", "sha1_smol"] }
# Installs and updates the app per user, swapping one release's folder for the next by rename, and downloads deltas
# (record/areas/install/01-installing-and-updating.md, "The installer and the updater"). Its Update.exe is the one `vpk`
# packs, so tools/lib/release.ts runs `vpk` at the version Cargo.lock gives this crate.
velopack = "=1.2.161"

# Windows Firewall's rules are COM objects, which windows-sys doesn't wrap. Tauri already builds this crate, at this version.
[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
]

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

# The local port's tests play the EFB app with a WebSocket client.
[dev-dependencies]
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client", "fastrand", "server", "sha1_smol"] }

# Cargo reads profiles only from a workspace's root, so the root's `lto` and `strip` are repeated here. Its
# `panic = "abort"` isn't, since that leaves the desktop app to start a crashed core again, and nothing would start this
# app again.
[profile.release]
lto = true
strip = true
