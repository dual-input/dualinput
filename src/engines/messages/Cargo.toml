[package]
name = "messages"
version.workspace = true
edition.workspace = true
publish = false

# The messages our TypeScript reads are JSON that serde_json writes, and ts-rs writes their
# TypeScript types from the derives on each (decision 025).
[dependencies]
# Our WASM module reads each routine's slot in place, as a `#[repr(C)]` struct, and
# bytemuck's derives check at compile time that a slot's struct has no padding and no
# pointer, so its bytes are all its fields.
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
# The core helper's pipe carries postcard, which this crate frames, so the hash covers its
# version (record/areas/core/04-core-helper.md, "The pipe").
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
# A command's arguments and a unit's message body are JSON the unit reads into its own types.
serde_json = "1.0.145"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

# build.rs hashes the crate with these two crates, and tests/hash.rs compiles build.rs into
# the tests, so the tests need them too. When you change a version in one list, change it
# in the other.
[build-dependencies]
sha2 = "0.10.9"
toml = "1.1.8"

[dev-dependencies]
sha2 = "0.10.9"
toml = "1.1.8"

[lints]
workspace = true
