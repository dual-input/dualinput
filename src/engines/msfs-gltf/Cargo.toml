[package]
name = "msfs-gltf"
version.workspace = true
edition.workspace = true
publish = false

# serde_json is already the core's, and reads the glTF's JSON into our own types, which name
# only what a cast and a pose need, so the reader refuses what it doesn't name rather than
# misreading it (record/areas/avatars/01-avatars.md, "Its engines").
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

[lints]
workspace = true
