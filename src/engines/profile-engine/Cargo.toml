[package]
name = "profile-engine"
version.workspace = true
edition.workspace = true
publish = false

# saphyr's tree carries a span on every node, so the checker points at the line and column
# of each mistake, and it refuses a repeated key in a map (record/areas/profiles/02-units.md,
# "The profile engine"). sha2 is the hash iroh already brings into the core.
[dependencies]
saphyr = "=0.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }

[lints]
workspace = true
