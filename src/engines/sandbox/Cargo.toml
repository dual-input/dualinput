[package]
name = "sandbox"
version.workspace = true
edition.workspace = true
publish = false

# The same rquickjs that src/engines/profile-build pins, so the builder's check that a compiled
# script parses runs the QuickJS-ng the sandbox runs it in; change both together.
[dependencies]
rquickjs = "=0.14.0"

# The context test reads the list in src/engines/profile-engine/javascript/sandbox.json.
[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
