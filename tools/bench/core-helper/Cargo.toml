[package]
name = "stand-in-core-helper"
version.workspace = true
edition.workspace = true
publish = false

# The bench's stand-in core helper, which a bench core starts in the real helper's place
# through the development setting that names the helper's program. It speaks the real pipe,
# and does what the bench tells it over a line of its own
# (record/areas/build/02-testing.md, "The stand-in core helper").
[dependencies]
messages = { path = "../../../engines/messages" }
serde_json = "1.0.145"
# Its stamps are µs on the performance counter, as the real helper's are.
windows-sys = { version = "0.61.2", features = ["Win32_System_Performance"] }
