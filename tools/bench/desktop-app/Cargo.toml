[package]
name = "stand-in-desktop-app"
version.workspace = true
edition.workspace = true
publish = false

# The bench's stand-in for the desktop app's program, which tools/bench.ts copies beside the
# bench build of the core as dualinput-desktop.exe, so a core that starts the desktop app's
# program from its own folder starts this. It writes down each start and exits.
[dependencies]
serde_json = "1.0.145"
