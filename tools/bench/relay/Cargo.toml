[package]
name = "bench-relay"
version.workspace = true
edition.workspace = true
publish = false

# One of the bench's local relays: iroh-relay's own server, unmodified, over plain HTTP on
# 127.0.0.1 with a test token and a cap, behind a TCP proxy that can hold back or cut each
# core's connection on its own, which the bench drives over standard input
# (record/areas/network/02-units.md, "Cases for the bench").
[dependencies]
iroh-relay = { version = "=1.3.0", features = ["server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.3", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# The proxy tells one core's connections from another's by the process that owns each, from
# Windows' table of TCP connections, and asks Windows for 1ms timers.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
