[package]
name = "figure-viewer"
version.workspace = true
edition.workspace = true
publish = false
description = "Poses avatars' figure with Figure's own code in the Baron 58P's cockpit, for the page serve.ts serves"

[dependencies]
aircraft-model = { path = "../../src/engines/aircraft-model" }
avatars-routines = { path = "../../src/features/avatars/routines" }
bytemuck = "1.25.2"
messages = { path = "../../src/engines/messages" }
routine-host = { path = "../../src/platform/routine-host" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
