[package]
name = "dualinput-profile-builder"
version.workspace = true
edition.workspace = true
publish = false
description = "Checks each profile and builds its bundle, for authors and CI, and serves the profile extension"

# lsp-server is the crate rust-analyzer's repository publishes for its own server, which runs the
# Language Server Protocol on threads and crossbeam channels with no async runtime, and lsp-types
# holds the protocol's types (record/areas/profiles/03-the-extension.md, "The language server").
# crossbeam-channel is the channel lsp-server's connection carries, which the server waits on
# beside its worker's.
[dependencies]
crossbeam-channel = "0.5.15"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
profile-build = { path = "../../src/engines/profile-build" }
profile-engine = { path = "../../src/engines/profile-engine" }
profile-language = { path = "../../src/engines/profile-language" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
