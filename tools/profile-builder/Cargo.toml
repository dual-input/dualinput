[package]
name = "dualinput-profile-builder"
version.workspace = true
edition.workspace = true
publish = false
description = "Checks each profile and builds its bundle, for authors and CI, and serves the profile extension"

# lsp-server is the crate rust-analyzer's repository publishes for its own server, which runs the
# Language Server Protocol on threads and crossbeam channels with no async runtime, and lsp-types
# holds the protocol's types (record/areas/profiles/03-the-extension.md, "The language server").
# crossbeam-channel is the channel lsp-server's connection carries, which the server waits on
# beside its worker's and its connection's to the core.
#
# The connection to the author's core is a WebSocket client, tokio-websockets 0.13.3, the
# implementation the core's own server and the desktop app's client use, so the workspace stays
# at one, on a current-thread tokio runtime in a thread of its own, which hands the core's
# messages to the rest of the server over crossbeam (record/areas/profiles/
# 04-the-extension-in-the-sim.md, "The connection"). Its `client` feature needs a SHA-1 and a
# random source, and sha1_smol and getrandom are the ones the lockfile already builds it with, so
# the client adds no package. futures-util gives the socket's `send` and `next`, as in the core.
[dependencies]
crossbeam-channel = "0.5.15"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
messages = { path = "../../src/engines/messages" }
profile-build = { path = "../../src/engines/profile-build" }
profile-engine = { path = "../../src/engines/profile-engine" }
profile-language = { path = "../../src/engines/profile-language" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "sync", "time"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client", "getrandom", "sha1_smol"] }
