[package]
name = "desk"
version.workspace = true
edition.workspace = true
publish = false

# The desk's stand-ins for what surrounds the core helper on a pilot's PC, for the helper's
# cases on a desk: a window of the sim's class, keys and clicks a pilot would make, a program
# that plays audio at a level in the Windows mixer, a process's CPU and memory, and decoding
# what the helper captured (record/areas/build/plan.md, "6 The core helper").
[[bin]]
name = "desk"
path = "src/main.rs"

[[bin]]
name = "desk-tone"
path = "src/tone.rs"

[dependencies]
ogg = "0.9.2"
opus-rs = "=0.1.39"
wasapi = "=0.25.0"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
